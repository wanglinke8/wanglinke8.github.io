<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>今日星座运势</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: #333;
            overflow-x: hidden;
        }

        .stars {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        .star {
            position: absolute;
            background: white;
            border-radius: 50%;
            animation: twinkle 2s infinite;
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0.3; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.2); }
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
            position: relative;
            z-index: 2;
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
            color: white;
        }

        .header h1 {
            font-size: 3em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
            animation: fadeInDown 1s ease-out;
        }

        .header .date {
            font-size: 1.2em;
            opacity: 0.9;
            animation: fadeInUp 1s ease-out 0.3s both;
        }

        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .constellation-card {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(20px);
            border-radius: 20px;
            padding: 30px;
            margin-bottom: 30px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            animation: slideIn 0.8s ease-out;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .constellation-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 45px rgba(0, 0, 0, 0.2);
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateX(-30px); }
            to { opacity: 1; transform: translateX(0); }
        }

        .info-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .info-item {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            padding: 20px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .info-item::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.1), transparent);
            transition: left 0.5s;
        }

        .info-item:hover::before {
            left: 100%;
        }

        .info-item:hover {
            transform: scale(1.05);
            background: rgba(255, 255, 255, 0.2);
        }

        .info-label {
            color: #fff;
            font-size: 0.9em;
            opacity: 0.8;
            margin-bottom: 8px;
        }

        .info-value {
            color: #fff;
            font-size: 1.2em;
            font-weight: bold;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.3);
        }

        .fortune-sections {
            display: grid;
            gap: 25px;
        }

        .fortune-item {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .fortune-item::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, #667eea, #764ba2);
        }

        .fortune-item:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.15);
        }

        .fortune-title {
            font-size: 1.3em;
            font-weight: bold;
            color: #333;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
        }

        .fortune-title::before {
            content: '✨';
            margin-right: 10px;
            font-size: 1.2em;
        }

        .fortune-desc {
            color: #666;
            line-height: 1.8;
            font-size: 1.05em;
        }

        .loading {
            text-align: center;
            color: white;
            font-size: 1.2em;
            margin: 50px 0;
        }

        .error {
            background: rgba(255, 107, 107, 0.9);
            color: white;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            margin: 20px 0;
        }

        .selection-container {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            align-items: end;
            justify-content: center;
            margin-bottom: 20px;
        }

        .select-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .select-group label {
            color: white;
            font-weight: 500;
            font-size: 1.1em;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.3);
        }

        .custom-select {
            padding: 12px 16px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 25px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            color: white;
            font-size: 1em;
            min-width: 200px;
            cursor: pointer;
            transition: all 0.3s ease;
            outline: none;
        }

        .custom-select:hover {
            border-color: rgba(255, 255, 255, 0.5);
            background: rgba(255, 255, 255, 0.2);
        }

        .custom-select:focus {
            border-color: white;
            box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.2);
        }

        .custom-select option {
            background: #4c5c96;
            color: white;
            padding: 10px;
        }

        .query-btn {
            background: linear-gradient(45deg, #ff6b6b, #ffd93d);
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 25px;
            font-size: 1.1em;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            text-shadow: 1px 1px 2px rgba(0,0,0,0.3);
            height: fit-content;
        }

        .query-btn:hover {
            transform: translateY(-2px) scale(1.05);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
            background: linear-gradient(45deg, #ff5252, #ffcc02);
        }

        .query-btn:active {
            transform: translateY(0) scale(1);
        }

        @media (max-width: 768px) {
            .container {
                padding: 15px;
            }

            .header h1 {
                font-size: 2.2em;
            }

            .info-grid {
                grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
                gap: 15px;
            }

            .constellation-card {
                padding: 20px;
            }
        }
    </style>
</head>
<body>
<div class="stars" id="stars"></div>

<div class="container">
    <div class="header">
        <h1>✨ 星座运势查询 ✨</h1>
        <div class="date" id="currentDate"></div>
    </div>

    <div class="constellation-card">
        <div class="selection-container">
            <div class="select-group">
                <label for="constellationSelect">选择星座：</label>
                <select id="constellationSelect" class="custom-select">
                    <option value="Aries">白羊座 (Aries)</option>
                    <option value="Taurus">金牛座 (Taurus)</option>
                    <option value="Gemini">双子座 (Gemini)</option>
                    <option value="Cancer">巨蟹座 (Cancer)</option>
                    <option value="Leo">狮子座 (Leo)</option>
                    <option value="Virgo">处女座 (Virgo)</option>
                    <option value="Libra">天秤座 (Libra)</option>
                    <option value="Scorpio">天蝎座 (Scorpio)</option>
                    <option value="Sagittarius">射手座 (Sagittarius)</option>
                    <option value="Capricorn">摩羯座 (Capricorn)</option>
                    <option value="Aquarius">水瓶座 (Aquarius)</option>
                    <option value="Pisces">双鱼座 (Pisces)</option>
                </select>
            </div>

            <div class="select-group">
                <label for="typeSelect">运势类型：</label>
                <select id="typeSelect" class="custom-select">
                    <option value="today">今日运势</option>
                    <option value="tomorrow">明日运势</option>
                    <option value="weeks">本周运势</option>
                    <option value="month">本月运势</option>
                    <option value="years">本年运势</option>
                </select>
            </div>

            <button class="query-btn" onclick="fetchData()">
                🔮 查询运势
            </button>
        </div>
    </div>

    <div id="loading" class="loading">
        🌟 正在获取您的星座运势...
    </div>

    <div id="error" class="error" style="display: none;">
        <p>获取运势信息失败，请稍后重试</p>
        <button class="query-btn" onclick="fetchData()">重新获取</button>
    </div>

    <div id="content" style="display: none;">
        <div class="constellation-card">
            <div class="info-grid" id="infoGrid">
                <!-- 运势信息将在这里动态插入 -->
            </div>
        </div>

        <div class="constellation-card">
            <div class="fortune-sections" id="fortuneSections">
                <!-- 运势详情将在这里动态插入 -->
            </div>
        </div>
    </div>
</div>

<script>
    // 创建星空背景
    function createStars() {
        const starsContainer = document.getElementById('stars');
        const starCount = 100;

        for (let i = 0; i < starCount; i++) {
            const star = document.createElement('div');
            star.className = 'star';
            star.style.left = Math.random() * 100 + '%';
            star.style.top = Math.random() * 100 + '%';
            star.style.width = star.style.height = Math.random() * 3 + 1 + 'px';
            star.style.animationDelay = Math.random() * 2 + 's';
            starsContainer.appendChild(star);
        }
    }

    // 获取数据
    async function fetchData() {
        const loading = document.getElementById('loading');
        const error = document.getElementById('error');
        const content = document.getElementById('content');

        // 获取选中的参数
        const constellation = document.getElementById('constellationSelect').value;
        const type = document.getElementById('typeSelect').value;

        loading.style.display = 'block';
        error.style.display = 'none';
        content.style.display = 'none';

        try {
            // 构建请求URL，添加参数
            const url = `http://localhost:8080/api/constellation/detail?constellation=${constellation}&type=${type}`;
            const response = await fetch(url);

            if (!response.ok) {
                throw new Error('网络请求失败');
            }

            const result = await response.json();
            if (result.code === 200) {
                renderData(result.data);
                loading.style.display = 'none';
                content.style.display = 'block';
            } else {
                throw new Error(result.msg || '获取数据失败');
            }
        } catch (err) {
            console.error('获取数据失败:', err);
            loading.style.display = 'none';
            error.style.display = 'block';
        }
    }

    // 获取星座中文名称
    function getConstellationName(englishName) {
        const constellationMap = {
            'Aries': '白羊座',
            'Taurus': '金牛座',
            'Gemini': '双子座',
            'Cancer': '巨蟹座',
            'Leo': '狮子座',
            'Virgo': '处女座',
            'Libra': '天秤座',
            'Scorpio': '天蝎座',
            'Sagittarius': '射手座',
            'Capricorn': '摩羯座',
            'Aquarius': '水瓶座',
            'Pisces': '双鱼座'
        };
        return constellationMap[englishName] || englishName;
    }

    // 获取运势类型中文名称
    function getTypeName(type) {
        const typeMap = {
            'today': '今日',
            'tomorrow': '明日',
            'weeks': '本周',
            'month': '本月',
            'years': '本年'
        };
        return typeMap[type] || type;
    }

    // 渲染数据
    function renderData(data) {
        renderInfo(data.info);
        renderFortuneSections(data.list);
        updatePageTitle();
    }

    // 更新页面标题
    function updatePageTitle() {
        const constellation = document.getElementById('constellationSelect').value;
        const type = document.getElementById('typeSelect').value;
        const constellationName = getConstellationName(constellation);
        const typeName = getTypeName(type);

        document.querySelector('.header h1').textContent = `✨ ${constellationName}${typeName}运势 ✨`;
    }

    // 渲染基本信息
    function renderInfo(info) {
        const infoGrid = document.getElementById('infoGrid');
        const infoLabels = [
            '综合运势', '爱情运势', '财富运势', '工作运势',
            '幸运数字', '幸运时间', '幸运颜色', '贵人星座'
        ];

        infoGrid.innerHTML = '';

        info.forEach((item, index) => {
            if (index < 8) { // 排除今日时间
                const [label, value] = item.split('：');
                const infoItem = document.createElement('div');
                infoItem.className = 'info-item';
                infoItem.style.animationDelay = (index * 0.1) + 's';

                infoItem.innerHTML = `
                        <div class="info-label">${label}</div>
                        <div class="info-value">${value}</div>
                    `;
                infoGrid.appendChild(infoItem);
            }
        });

        // 设置日期
        const dateInfo = info.find(item => item.includes('今日时间'));
        if (dateInfo) {
            const date = dateInfo.split('：')[1];
            document.getElementById('currentDate').textContent = date;
        }
    }

    // 渲染运势详情
    function renderFortuneSections(list) {
        const fortuneSections = document.getElementById('fortuneSections');
        fortuneSections.innerHTML = '';

        list.forEach((item, index) => {
            const fortuneItem = document.createElement('div');
            fortuneItem.className = 'fortune-item';
            fortuneItem.style.animationDelay = (index * 0.1) + 's';

            fortuneItem.innerHTML = `
                    <div class="fortune-title">${item.title}</div>
                    <div class="fortune-desc">${item.desc}</div>
                `;
            fortuneSections.appendChild(fortuneItem);
        });
    }

    // 初始化
    document.addEventListener('DOMContentLoaded', function() {
        createStars();
        // 页面加载时不自动获取数据，等待用户选择参数后手动查询
        updatePageTitle();

        // 添加选择框变化监听
        document.getElementById('constellationSelect').addEventListener('change', updatePageTitle);
        document.getElementById('typeSelect').addEventListener('change', updatePageTitle);
    });
</script>
</body>
</html>
